<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarra8</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #10131a;
      color: #f3f5fa;
      font: 14px "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      border: 1px solid #ffffff20;
      border-radius: 14px;
    }
    main { width: 282px; }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: .04em;
    }
    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid #d6bc76;
      border-radius: 9px;
      color: #f1db91;
      font-size: 15px;
    }
    p { margin: 16px 0 10px; color: #c4cad6; }
    .progress {
      position: relative;
      height: 5px;
      overflow: hidden;
      border-radius: 5px;
      background: #ffffff19;
    }
    .progress::after {
      position: absolute;
      inset: 0 auto 0 -42%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #b79b54, #f1db91, #b79b54);
      content: "";
      animation: loading 1.35s ease-in-out infinite;
    }
    .hint { margin-top: 9px; color: #808a9b; font-size: 11px; }
    @keyframes loading {
      from { transform: translateX(0); }
      to { transform: translateX(340%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress::after { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <header><span class="brand-mark" aria-hidden="true">S</span><span>Sarra8</span></header>
    <p>Préparation de votre avatar…</p>
    <div class="progress" role="progressbar" aria-label="Chargement de Sarra8"></div>
    <div class="hint">Cela peut prendre quelques instants.</div>
  </main>
</body>
</html>
