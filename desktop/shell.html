<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sarra — coque</title>
<script>(function(){try{var t=localStorage.getItem('sarra.theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #10131a;
    --pn: #171b24;
    --ln: #293040;
    --tx: #e3e7ee;
    --mu: #8d97a8;
    --ac: #8197ff;
    --ac2: #232b49;
    --startup-bg: rgba(12, 15, 22, 0.82);
    --startup-detail: #ffb4b4;
    --win-hover-bg: #2a2030;
    --win-hover-tx: #ff9aa2;
    --win-hover-ln: #4a2b36;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #e6eaf0;
    --pn: #f7f8fa;
    --ln: #d3d9e2;
    --tx: #1b2230;
    --mu: #5c6779;
    --ac: #3652d9;
    --ac2: #e9edfc;
    --startup-bg: rgba(230, 234, 240, 0.82);
    --startup-detail: #b3324a;
    --win-hover-bg: #fbe9ec;
    --win-hover-tx: #c93b3b;
    --win-hover-ln: #e3b9c2;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    color: var(--tx);
    font: 12px/1.35 Figtree, system-ui, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  #app-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    display: block;
  }

  /* ==================== Écran de démarrage (avatar) ==================== */
  #startup {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--startup-bg);
    backdrop-filter: blur(3px);
    z-index: 10;
    transition: opacity 220ms ease;
  }
  #startup[data-state="complete"],
  #startup[hidden] { opacity: 0; pointer-events: none; }

  #startup .box {
    width: min(240px, 82%);
    display: grid;
    gap: 10px;
    justify-items: center;
    text-align: center;
  }
  #startup .ring {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(129, 151, 255, 0.22);
    border-top-color: var(--ac);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #startup .bar {
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  #startup .bar i {
    display: block;
    height: 100%;
    width: 12%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--ac), #5ee0c8);
    animation: startup-progress 2.4s ease-in-out infinite;
  }
  @keyframes startup-progress {
    0% { width: 8%; transform: translateX(0); }
    50% { width: 62%; }
    100% { width: 8%; transform: translateX(760%); }
  }
  #startup .label { font-size: 11.5px; color: var(--mu); }
  #startup[data-state="error"] .ring { animation: none; border-color: rgba(255, 107, 107, 0.5); border-top-color: #ff6b6b; }
  #startup[data-state="error"] .bar { display: none; }
  #startup .detail {
    font-size: 11px;
    color: var(--startup-detail);
    max-height: 74px;
    overflow: auto;
    word-break: break-word;
  }
  #startup button {
    background: var(--ac2);
    color: var(--tx);
    border: 1px solid var(--ln);
    border-radius: 8px;
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
  }
  #startup button:hover { border-color: var(--ac); }
  #startup .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #startup[data-state="missing"] .ring { animation: none; border-color: rgba(255, 206, 77, 0.5); border-top-color: #ffce4d; }
  #startup[data-state="missing"] .bar { display: none; }
  #startup[data-state="missing"] .detail { color: #ffe1a3; }

  /* ==================== Mode réglages ==================== */
  body[data-mode="settings"] { background: var(--bg); }

  #tabs {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 10px;
    background: var(--pn);
    border-bottom: 1px solid var(--ln);
    -webkit-app-region: drag;
    z-index: 20;
  }
  #tabs .brand {
    font-weight: 700;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--mu);
    margin-right: 6px;
  }
  #tabs .tab {
    -webkit-app-region: no-drag;
    height: 26px;
    padding: 0 12px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--mu);
    font: inherit;
    cursor: pointer;
  }
  #tabs .tab:hover { background: var(--ac2); color: var(--tx); }
  #tabs .tab[aria-selected="true"] {
    background: var(--ac2);
    border-color: var(--ln);
    color: var(--tx);
    font-weight: 600;
  }
  #tabs .tab[aria-current="page"] {
    background: var(--ac2);
    border-color: var(--ln);
    color: var(--tx);
    font-weight: 600;
    cursor: default;
  }
  #tabs .spacer { flex: 1; }
  #tabs .win-btn {
    -webkit-app-region: no-drag;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 1px solid var(--ln);
    background: transparent;
    color: var(--mu);
    font: inherit;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  #tabs .win-btn:hover { background: var(--win-hover-bg); color: var(--win-hover-tx); border-color: var(--win-hover-ln); }

  body[data-mode="settings"] iframe {
    position: fixed;
    top: 40px;
    left: 0;
    border: 0;
    width: 100%;
    height: calc(100% - 40px);
    background: var(--bg);
  }
  #app-frame[hidden], #panel-native[hidden] { display: none; }

  #grip {
    position: fixed;
    right: 0;
    bottom: 0;
    width: 18px;
    height: 18px;
    cursor: nwse-resize;
    z-index: 30;
    background: linear-gradient(135deg, transparent 44%, var(--mu) 44%, var(--mu) 52%, transparent 52%, transparent 62%, var(--mu) 62%, var(--mu) 70%, transparent 70%);
    opacity: 0.5;
  }
  #grip:hover { opacity: 0.95; }
  body[data-mode="avatar"] #grip,
  body[data-mode="avatar"] #tabs { display: none; }

  /* Poignées de redimensionnement de la fenêtre avatar (au-dessus de l'iframe) */
  body[data-mode="avatar"] .edge {
    position: fixed;
    z-index: 15;
    opacity: 0;
  }
  body[data-mode="avatar"] .edge[data-dir="n"],
  body[data-mode="avatar"] .edge[data-dir="s"] { left: 22%; right: 22%; height: 6px; cursor: ns-resize; }
  body[data-mode="avatar"] .edge[data-dir="e"],
  body[data-mode="avatar"] .edge[data-dir="w"] { top: 22%; bottom: 22%; width: 6px; cursor: ew-resize; }
  body[data-mode="avatar"] .edge[data-dir="n"] { top: 0; }
  body[data-mode="avatar"] .edge[data-dir="s"] { bottom: 0; }
  body[data-mode="avatar"] .edge[data-dir="e"] { right: 0; }
  body[data-mode="avatar"] .edge[data-dir="w"] { left: 0; }
  body[data-mode="avatar"] .edge[data-dir="ne"],
  body[data-mode="avatar"] .edge[data-dir="nw"],
  body[data-mode="avatar"] .edge[data-dir="se"],
  body[data-mode="avatar"] .edge[data-dir="sw"] { width: 14px; height: 14px; }
  body[data-mode="avatar"] .edge[data-dir="nw"] { top: 0; left: 0; cursor: nwse-resize; }
  body[data-mode="avatar"] .edge[data-dir="se"] { bottom: 0; right: 0; cursor: nwse-resize; }
  body[data-mode="avatar"] .edge[data-dir="ne"] { top: 0; right: 0; cursor: nesw-resize; }
  body[data-mode="avatar"] .edge[data-dir="sw"] { bottom: 0; left: 0; cursor: nesw-resize; }
</style>
</head>
<body data-mode="avatar">

<!-- ==================== Mode réglages : panneau de configuration ==================== -->
<div id="tabs" hidden>
  <span class="brand">SARRA</span>
  <span class="tab" aria-current="page">Configuration</span>
  <span class="spacer"></span>
  <button class="win-btn" id="btn-close" title="Masquer les réglages (Ctrl+Shift+K)" type="button">✕</button>
</div>

<div id="grip" hidden title="Redimensionner"></div>

<!-- Mode avatar : iframe de l'app + écran de démarrage -->
<iframe id="app-frame" title="Avatar Sarra" allow="microphone; autoplay; camera"></iframe>

<!-- Mode réglages : panneau noir (configuration, calibration et onboarding) -->
<iframe id="panel-native" hidden title="Réglages Sarra" allow="microphone"></iframe>

<div id="startup" data-state="loading">
  <div class="box">
    <div class="ring" aria-hidden="true"></div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="label" id="startup-label">Chargement de l'avatar…</div>
    <div class="detail" id="startup-detail"></div>
    <div class="actions">
      <button id="startup-settings" type="button" hidden>Ouvrir les réglages</button>
      <button id="startup-retry" type="button" hidden>Réessayer</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ==========================================================================
 * Paramètres fournis par main.js
 *   ?mode=avatar|settings & app=<url absolue de l'app>
 * ========================================================================== */
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') === 'settings' ? 'settings' : 'avatar';
const APP_URL = params.get('app') || '';

const bridge = window.sarraDesktop || window.sarra8 || {};
const panelApi = window.sarra8 || window.sarraDesktop || {};

document.body.dataset.mode = MODE;

/* Thème clair / sombre : synchronisé avec l'avatar et le panneau de configuration. */
const THEME_LS = 'sarra.theme';
function applyShellTheme(mode) {
  document.documentElement.dataset.theme = mode === 'light' ? 'light' : 'dark';
}
try {
  const saved = localStorage.getItem(THEME_LS);
  applyShellTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
} catch (_) {
  applyShellTheme('dark');
}
window.addEventListener('storage', (event) => {
  if (event.key === THEME_LS && (event.newValue === 'light' || event.newValue === 'dark')) applyShellTheme(event.newValue);
});
if (typeof BroadcastChannel !== 'undefined') {
  try {
    new BroadcastChannel('sarra-shell').onmessage = (event) => {
      const data = event && event.data;
      if (data && data.type === 'theme' && (data.mode === 'light' || data.mode === 'dark')) applyShellTheme(data.mode);
    };
  } catch (_) { /* ignore */ }
}

const appFrame = document.getElementById('app-frame');
const nativeFrame = document.getElementById('panel-native');
const startup = document.getElementById('startup');
const startupLabel = document.getElementById('startup-label');
const startupDetail = document.getElementById('startup-detail');
const startupRetry = document.getElementById('startup-retry');
const startupSettings = document.getElementById('startup-settings');
const tabs = document.getElementById('tabs');
const grip = document.getElementById('grip');
let startupTimeout = null;

/* ==========================================================================
 * 1. URL de l'iframe
 * ========================================================================== */
function frameUrl(shell) {
  if (!APP_URL) return 'about:blank';
  const url = new URL(APP_URL);
  url.searchParams.set('shell', shell);
  return url.toString();
}

function armStartupTimeout() {
  if (startupTimeout) clearTimeout(startupTimeout);
  startupTimeout = setTimeout(() => {
    startupTimeout = null;
    if (startup.dataset.state === 'loading') {
      setStartup('error', 'Le démarrage prend trop de temps. Vérifiez le modèle VRM ou réessayez.');
    }
  }, 30000);
}

/* ==========================================================================
 * 2. Mode avatar : iframe plein cadre + démarrage
 * ========================================================================== */
function initAvatarMode() {
  if (!APP_URL) {
    setStartup('error', "Application web introuvable. Vérifiez que le fichier « Sarra — avatar VRM & lipsync avancé.html » est à la racine.");
    return;
  }

  appFrame.hidden = false;
  armStartupTimeout();
  appFrame.src = frameUrl('avatar');

  // L'app prévient la coque de l'avancement du chargement du VRM.
  window.addEventListener('message', (event) => {
    if (event.origin !== location.origin) return;
    const data = event.data;
    if (!data || data.type !== 'sarra-startup') return;
    if (data.state === 'complete') setStartup('complete');
    else if (data.state === 'error') setStartup('error', data.detail || 'Le modèle VRM n’a pas pu être chargé.');
    else setStartup('loading', data.detail || 'Chargement de l’avatar…');
  });

  initEdgeResize();

  appFrame.addEventListener('load', () => {
    attachFrameListeners();
  });

  startupRetry.addEventListener('click', () => {
    setStartup('loading');
    armStartupTimeout();
    appFrame.src = frameUrl('avatar');
  });

  startupSettings.addEventListener('click', () => {
    bridge.toggleSettings && bridge.toggleSettings(true);
  });

  // Modèle VRM : la coque pousse sarra7.vrm, ou signale son absence.
  if (bridge.on) {
    bridge.on('vrm:missing', (payload) => {
      setStartup('missing', (payload && payload.message) || 'Aucun modèle VRM par défaut.');
    });
    bridge.on('vrm:status', (payload) => {
      if (payload && payload.ok) setStartup('complete');
      else if (payload) setStartup('missing', payload.error || 'Le modèle VRM n’a pas pu être chargé.');
    });
  }

  // Interrupteur de secours : Ctrl+Shift+L verrouille/déverrouille l'interaction.
  document.addEventListener('keydown', (event) => {
    if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 'l') {
      event.preventDefault();
      bridge.setInteractiveLock && bridge.setInteractiveLock(true);
    }
  });
}

function setStartup(state, detail = '') {
  if (state !== 'loading' && startupTimeout) {
    clearTimeout(startupTimeout);
    startupTimeout = null;
  }
  if (MODE === 'avatar' && state !== 'loading' && bridge.startupStatus) bridge.startupStatus(state);
  startup.dataset.state = state;
  const labels = {
    complete: '',
    error: 'Chargement impossible',
    missing: 'Avatar 3D non chargé',
    loading: 'Chargement de l’avatar…'
  };
  startupLabel.textContent = labels[state] || labels.loading;
  startupDetail.textContent = detail;
  startupRetry.hidden = state !== 'error' && state !== 'missing';
  startupSettings.hidden = state !== 'missing' && state !== 'error';
  if (state === 'complete') {
    startup.setAttribute('hidden', '');
  } else {
    startup.removeAttribute('hidden');
  }
}

/* ==========================================================================
 * 3. Survol de l'avatar -> click-through (tâche 1 & 2)
 *
 * L'iframe est de même origine : on peut donc écouter directement les
 * événements de son document (mouseenter/mouseleave, molette, clavier).
 * Main conserve en parallèle un test de position du curseur (filet de
 * sécurité multi-plateforme, voir main.js).
 * ========================================================================== */
let interactive = false;

function enterInteractive() {
  if (interactive) return;
  interactive = true;
  bridge.setIgnoreMouseEvents && bridge.setIgnoreMouseEvents(false);
}

function leaveInteractive() {
  if (!interactive) return;
  interactive = false;
  bridge.setIgnoreMouseEvents && bridge.setIgnoreMouseEvents(true);
}

function attachFrameListeners() {
  let doc = null;
  try {
    doc = appFrame.contentDocument;
  } catch (_) {
    return; // cross-origin : on laisse le test de position du main décider
  }
  if (!doc || doc.__sarraShellHooked) return;
  doc.__sarraShellHooked = true;

  const root = doc.documentElement;

  root.addEventListener('mouseenter', enterInteractive, true);
  root.addEventListener('mouseleave', leaveInteractive, true);
  doc.addEventListener('mouseleave', leaveInteractive, true);
  window.addEventListener('mouseleave', leaveInteractive, true);

  // Molette au-dessus de l'avatar -> redimensionnement de la fenêtre
  // (tâche 2 : « redimensionnable via la molette »).
  let wheelTimer = null;
  let wheelDelta = 0;
  root.addEventListener('wheel', (event) => {
    event.preventDefault();
    wheelDelta += event.deltaY;
    if (wheelTimer) return;
    wheelTimer = setTimeout(() => {
      const deltaY = wheelDelta;
      wheelDelta = 0;
      wheelTimer = null;
      if (Math.abs(deltaY) < 1) return;
      bridge.resizeAvatar && bridge.resizeAvatar({ deltaY });
    }, 60);
  }, { passive: false });

  // Perte de focus : on rend la souris transparente pour ne pas bloquer
  // les clics vers les fenêtres situées dessous.
  window.addEventListener('blur', () => { if (!interactive) return; leaveInteractive(); });
  doc.addEventListener('visibilitychange', () => { if (doc.hidden) leaveInteractive(); });
}

/* ==========================================================================
 * 3 bis. Redimensionnement par les bords (fenêtre avatar frameless)
 *
 * Les poignées sont des surcouches au-dessus de l'iframe : elles captent le
 * pointerdown sur 6 px de bord, le reste de la fenêtre continue de recevoir
 * les clics destinés à l'avatar.
 * ========================================================================== */
const EDGES = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];

function initEdgeResize() {
  const handles = EDGES.map((dir) => {
    const el = document.createElement('div');
    el.className = 'edge';
    el.dataset.dir = dir;
    document.body.appendChild(el);
    return el;
  });

  let resize = null;

  for (const handle of handles) {
    handle.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      resize = {
        dir: handle.dataset.dir,
        sx: event.screenX,
        sy: event.screenY,
        w: window.innerWidth,
        h: window.innerHeight,
        x: window.screenX,
        y: window.screenY
      };
      enterInteractive();
      try { handle.setPointerCapture(event.pointerId); } catch (_) { /* ignore */ }
    });
  }

  window.addEventListener('pointermove', (event) => {
    if (!resize) return;
    const { dir, sx, sy, w, h, x, y } = resize;
    const dx = event.screenX - sx;
    const dy = event.screenY - sy;

    const aspect = h / w;
    let width = w;
    if (dir.includes('e')) width = w + dx;
    if (dir.includes('w')) width = w - dx;
    if (dir === 'n' || dir === 's') width = (h + (dir === 's' ? dy : -dy)) / aspect;

    width = Math.max(160, Math.min(900, width));
    const height = Math.round(width * aspect);

    // Ancrage : le bord opposé reste fixe.
    const nextX = dir.includes('w') ? x + (w - Math.round(width)) : x;
    const nextY = dir.includes('n') ? y + (h - height) : y;

    bridge.resizeAvatar && bridge.resizeAvatar({ w: Math.round(width), aspect, x: nextX, y: nextY });
  });

  const stop = () => { resize = null; };
  window.addEventListener('pointerup', stop);
  window.addEventListener('pointercancel', stop);
}

/* ==========================================================================
 * 4. Mode réglages : panneau de configuration
 * ========================================================================== */
function initSettingsMode() {
  tabs.hidden = false;
  grip.hidden = false;
  startup.setAttribute('hidden', '');

  appFrame.hidden = true;
  nativeFrame.hidden = false;
  nativeFrame.src = `${location.origin}/desktop/settings-panel.html`;

  document.getElementById('btn-close').addEventListener('click', () => {
    panelApi.closeSettings ? panelApi.closeSettings() : window.close();
  });

  window.addEventListener('message', (event) => {
    if (event.origin !== location.origin) return;
    const data = event.data;
    if (!data) return;
    if (data.type === 'sarra-close-settings') panelApi.closeSettings && panelApi.closeSettings();
  });

  // Relais de l'onboarding : le main envoie `trigger-onboarding` au shell.
  if (panelApi.on) {
    panelApi.on('trigger-onboarding', (payload) => {
      try {
        nativeFrame.contentWindow.postMessage({ type: 'sarra-onboarding', payload }, location.origin);
      } catch (_) { /* ignore */ }
    });
  }

  bindWindowChrome();
}

/* ==========================================================================
 * 5. Chromes de fenêtre (déplacement / taille) — frameless
 * ========================================================================== */
function bindWindowChrome() {
  // Déplacement par la barre d'onglets
  let drag = null;
  tabs.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    if (event.target.closest('button')) return;
    drag = { sx: event.screenX, sy: event.screenY };
    try { tabs.setPointerCapture(event.pointerId); } catch (_) {}
    panelApi.dragStart && panelApi.dragStart({ x: event.screenX, y: event.screenY });
  });
  window.addEventListener('pointermove', (event) => {
    if (!drag) return;
    panelApi.dragMove && panelApi.dragMove({ x: event.screenX, y: event.screenY });
  });
  const endDrag = () => {
    if (!drag) return;
    drag = null;
    panelApi.dragEnd && panelApi.dragEnd();
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  // Redimensionnement par la poignée
  let rs = null;
  grip.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    rs = { sx: event.screenX, sy: event.screenY, w: innerWidth, h: innerHeight };
    try { grip.setPointerCapture(event.pointerId); } catch (_) {}
  });
  window.addEventListener('pointermove', (event) => {
    if (!rs) return;
    panelApi.resizeSettings && panelApi.resizeSettings({
      w: rs.w + (event.screenX - rs.sx),
      h: rs.h + (event.screenY - rs.sy)
    });
  });
  window.addEventListener('pointerup', () => { rs = null; });
  window.addEventListener('pointercancel', () => { rs = null; });

  // Échap ferme les réglages (comme le panneau d'origine)
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') panelApi.closeSettings && panelApi.closeSettings();
  });
}

/* ==========================================================================
 * 6. Démarrage
 * ========================================================================== */
if (MODE === 'settings') initSettingsMode();
else initAvatarMode();
</script>
</body>
</html>
